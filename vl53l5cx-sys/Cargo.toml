[package]
name = "vl53l5cx-sys"
version = "0.1.0"
edition = "2021"
description = "Raw bindings to ST's VL53L5CX ULD driver (compiled as-is from vendor/)"
license = "BSD-3-Clause"
links = "vl53l5cx_uld"
build = "build.rs"

[features]
# Which outputs the sensor sends. Disabled outputs are compiled out of the ULD
# (VL53L5CX_DISABLE_*), which shrinks I2C traffic and RAM. Defaults match ST's
# example platform.h, plus reflectance.
default = [
    "ambient-per-spad",
    "nb-target-detected",
    "signal-per-spad",
    "distance-mm",
    "reflectance-percent",
    "target-status",
]
ambient-per-spad = []
nb-spads-enabled = []
nb-target-detected = []
signal-per-spad = []
range-sigma-mm = []
distance-mm = []
reflectance-percent = []
target-status = []
# VL53L5CX_NB_TARGET_PER_ZONE (default 1). Highest enabled wins.
targets-2 = []
targets-3 = []
targets-4 = []

[build-dependencies]
cc = "1"
bindgen = "0.71"
